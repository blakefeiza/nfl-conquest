<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NFL Conquest Map</title>
    <script src="data.js"></script>
    <script src="shim.js"></script>
    <script src="core.js?v=6"></script>
    <script src="render.js?v=6"></script>
    <script src="ui.js?v=6"></script>
    <style>
      :root { --accent: #d50a0a; --bg: #f4f2ec; --ink: #12151c; --mute: #6a7180; --line: rgba(18,21,28,.12); --card: #ffffff; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
        font-family: -apple-system, "SF Pro Display", "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
      #app { position: fixed; inset: 0; display: flex; }
      #stage { position: relative; flex: 1 1 auto; min-width: 0;
        background: radial-gradient(900px 600px at 40% 45%, #fbfaf6 0%, #f4f2ec 60%, #ece9e1 100%); overflow: hidden; }
      #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { position: absolute; left: 24px; top: 16px; pointer-events: none; }
      .title { font-size: 36px; line-height: 40px; font-weight: 900; font-style: italic; letter-spacing: -.025em; text-transform: uppercase; }
      .rule { height: 4px; background: var(--ink); margin: 2px 0 6px; border-radius: 1px; }
      .sub { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      #weekWrap { height: 22px; overflow: hidden; position: relative; display: inline-block; }
      #weekLabel { display: block; line-height: 22px; color: var(--accent); transition: color .5s; }
      #chips { position: absolute; right: 22px; top: 18px; display: flex; gap: 10px; pointer-events: none; }
      .chip { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-width: 88px; box-shadow: 0 2px 10px rgba(18,21,28,.06); }
      .chip .k { font-size: 9px; letter-spacing: .1em; white-space: nowrap; text-transform: uppercase; color: var(--mute); font-weight: 700; }
      .chip .v { font-size: 22px; font-weight: 900; letter-spacing: -.01em; margin-top: 1px; white-space: nowrap; }
      .chip .v small { font-size: 12px; font-weight: 700; color: var(--mute); margin-left: 4px; }
      .badge { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 30px; height: 26px; }
      .badge .logo { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
      .badge.txt { border-radius: 7px; font-size: 11px; font-weight: 900; letter-spacing: .03em; }
      #loading { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; color: var(--mute); font-size: 13px; letter-spacing: .12em; pointer-events: none; font-weight: 700; }
      #champ { position: absolute; left: 50%; top: 62px; transform: translateX(-50%); display: none; padding: 8px 18px; border-radius: 999px; font-weight: 900; letter-spacing: .2em; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
      #tip { position: absolute; left: 0; top: 0; will-change: transform; display: block; visibility: hidden; opacity: 0;
        transition: transform 260ms cubic-bezier(.22,.61,.36,1), opacity 120ms, visibility 0s linear 120ms; }
      #tip.on { visibility: visible; opacity: 1; transition: transform 260ms cubic-bezier(.22,.61,.36,1), opacity 120ms, visibility 0s; }
      #tip.no-tr { transition: none; }
      .btn:focus-visible, .row:focus-visible, #scrub:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      #tip { pointer-events: none; z-index: 20; background: #fff; border: 1px solid var(--line);
        border-radius: 10px; padding: 8px 11px; font-size: 12px; min-width: 150px; box-shadow: 0 8px 24px rgba(18,21,28,.2); }
      #tip .tn { font-weight: 900; font-size: 13px; display: flex; align-items: center; gap: 7px; }
      #tip .tr { color: var(--mute); margin-top: 3px; font-weight: 600; }
      #controls { position: absolute; left: 18px; right: 18px; bottom: 16px; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
        background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 6px 24px rgba(18,21,28,.1); }
      .btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: #f6f5f1; color: var(--ink);
        display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: background .15s, transform .1s; }
      .btn:hover:not(:active) { background: #ebe9e2; }
      .btn { transition: background .15s; }
      .btn:active { transform: scale(.94); }
      #play { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
        box-shadow: 0 0 0 0 var(--accent); transition: background .5s, transform .1s, box-shadow .3s; }
      #play.on { box-shadow: 0 4px 18px 0 var(--accent); }
      #play svg, .btn svg { width: 18px; height: 18px; fill: currentColor; }
      #speed { width: 46px; font-size: 12px; font-weight: 900; letter-spacing: .02em; }
      #scrub { position: relative; flex: 1 1 auto; height: 40px; cursor: pointer; touch-action: none; user-select: none; }
      #track { position: absolute; left: 0; right: 0; top: 8px; height: 6px; border-radius: 3px; background: rgba(18,21,28,.12); }
      #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 3px; background: var(--accent); transform: scaleX(0); transform-origin: left;
        transition: transform .45s cubic-bezier(.3,.8,.3,1), background .5s; will-change: transform; }
      #thumb { position: absolute; left: 0; top: 11px; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #fff; border: 3px solid var(--accent);
        box-shadow: 0 2px 8px rgba(18,21,28,.3); transition: transform .45s cubic-bezier(.3,.8,.3,1), border-color .5s; will-change: transform; }
      .tick { position: absolute; top: 22px; transform: translateX(-50%); font-size: 10px; color: var(--mute); font-weight: 700; transition: color .2s; }
      .tick.cur { color: var(--ink); font-weight: 900; }
      #panel { flex: 0 0 340px; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: #fbfaf7; }
      .ph { padding: 16px 18px 8px; display: flex; align-items: baseline; justify-content: space-between; }
      .ph .t { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink); font-weight: 900; }
      .ph .s { font-size: 11px; color: var(--mute); font-weight: 600; }
      #boardWrap { flex: 1 1 58%; min-height: 0; overflow-y: auto; padding: 0 10px 8px 10px; }
      #board { position: relative; }
      .row { position: absolute; left: 0; right: 0; height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 9px; cursor: pointer;
        transition: transform .7s cubic-bezier(.25,.9,.25,1), opacity .5s, background .2s; will-change: transform; }
      .row:hover, .row.pin { background: rgba(18,21,28,.06); }
      .row .rk { width: 18px; text-align: right; font-size: 11px; color: var(--mute); font-weight: 800; }
      .row .mid { flex: 1 1 auto; min-width: 0; position: relative; }
      .row .nm { font-size: 12.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; display: inline-block; max-width: 100%; }
      .row .bar { height: 3px; border-radius: 2px; margin-top: 3px; transform-origin: left; transition: transform .7s cubic-bezier(.25,.9,.25,1); }
      .row .pc { width: 52px; text-align: right; font-size: 12.5px; font-weight: 900; }
      .row.dead { opacity: .4; }
      .row.dead .pc { color: var(--mute); font-size: 11px; font-weight: 700; }
      #resWrap { flex: 1 1 auto; max-height: 46%; display: flex; flex-direction: column; min-height: 120px; border-top: 1px solid var(--line); }
      #results { overflow-y: auto; padding: 0 12px 12px; }
      /* weekly results: one scoreboard card per game */
      .game { display: grid; grid-template-columns: 4px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px 7px 0; margin-bottom: 6px; overflow: hidden;
        background: #fff; border: 1px solid var(--line); border-radius: 12px; font-size: 12px; cursor: default; transition: background .15s, transform .3s; }
      .game:hover:not(:active) { background: #f6f5f1; }
      .game.active { background: rgba(18,21,28,.07); transform: translateX(3px); }
      .game.in { animation: gin .38s cubic-bezier(.22,.61,.36,1) backwards; animation-delay: calc(var(--i) * 26ms); }
      @keyframes gin { from { opacity: 0; transform: translateY(8px); } }
      .game .gs { align-self: stretch; border-radius: 0 3px 3px 0; }
      .game .gt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .game .gteam { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 900; letter-spacing: .02em; }
      .game .gteam .badge { width: 26px; height: 20px; }
      .game .gteam .cd { flex: 1 1 auto; }
      .game .gteam .pt { min-width: 28px; text-align: right; font-size: 14px; }
      .game .gteam.l { color: var(--mute); font-weight: 700; }
      .game .gteam.l .badge { opacity: .55; }
      .game .gteam.l .pt { font-size: 13px; }
      .game .mv { padding: 4px 9px; border-radius: 999px; background: rgba(18,21,28,.06); color: var(--mute); font-size: 11px; font-weight: 800; white-space: nowrap; }
      .game .mv.on { background: rgba(15,157,88,.13); color: #0b7a45; }
      .game.empty { display: block; padding: 10px; text-align: center; color: var(--mute); font-weight: 700; background: transparent; border-style: dashed; }
      /* team logos ride DOM layers moved by transform, so the compositor glides them even when the map redraw is busy */
      #logos { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .lg { position: absolute; left: 0; top: 0; width: 170px; height: 170px; margin: -85px 0 0 -85px; will-change: transform, opacity;
        transition: transform .7s cubic-bezier(.25,.9,.25,1), opacity .4s; }
      .lg img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 0 5px rgba(255,255,255,.9)) drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
      .lg .crest { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 52px; border: 12px solid; }
      .lead { position: absolute; left: 0; top: 0; height: 0; transform-origin: 0 0; opacity: 0; transition: opacity .3s; }
      .lead.on { opacity: 1; }
      .lead i { position: absolute; left: 0; top: -1px; right: 0; height: 2px; background: var(--c); box-shadow: 0 0 0 1.5px #fff; }
      .lead b { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px #fff; }
      #msg { position: absolute; left: 0; right: 0; top: 50%; text-align: center; color: #b42318; font-size: 13px; padding: 0 30px; display: none; font-weight: 700; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      }
      @media (max-width: 780px) {
        #app { flex-direction: column; }
        #panel { flex: 0 0 38%; border-left: 0; border-top: 1px solid var(--line); }
        #chips { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="map"></canvas>
        <div id="logos"></div>
        <div id="hud"><div class="title">NFL Conquest 2026</div><div class="rule"></div><div class="sub"><span>Territory map -</span><span id="weekWrap"><span id="weekLabel">Preseason</span></span></div></div>
        <div id="chips">
          <div class="chip"><div class="k">Teams with land</div><div class="v" id="aliveV">32<small>/ 32</small></div></div>
          <div class="chip"><div class="k">Leader</div><div class="v" id="leadV">-</div></div>
        </div>
        <div id="champ"></div>
        <div id="loading">LOADING CONQUEST DATA</div>
        <div id="msg"></div>
        <div id="tip"></div>
        <div id="controls">
          <button class="btn" id="prev" title="Previous week (Left)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
          <button class="btn" id="play" title="Play / pause (Space)"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="btn" id="next" title="Next week (Right)"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
          <div id="scrub"><div id="track"><div id="fill"></div></div><div id="thumb"></div></div>
          <button class="btn" id="speed" title="Playback speed">1x</button>
        </div>
      </div>
      <aside id="panel">
        <div class="ph"><span class="t">Standings</span><span class="s" id="boardSub">share of the map</span></div>
        <div id="boardWrap"><div id="board"></div></div>
        <div id="resWrap"><div class="ph"><span class="t" id="resTitle">Results</span><span class="s" id="resSub"></span></div><div id="results"></div></div>
      </aside>
    </div>
  </body>
</html>
